<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANTHIVE – Kachelprototyp</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#191513; color:#f2e5d6; }
    body { margin:0 auto; max-width:1100px; padding:24px; }
    h1 { margin:0 0 6px; font-size:1.5rem; } p { color:#c9b7a7; margin:0 0 22px; }
    main { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
    figure { margin:0; padding:12px; background:#2a231e; border:1px solid #554438; border-radius:8px; }
    img { display:block; width:192px; height:192px; image-rendering:pixelated; image-rendering:crisp-edges; background:#171411; }
    figcaption { margin-top:10px; font-weight:600; }
    small { display:block; color:#bfae9f; font-weight:400; margin-top:3px; }
  </style>
</head>
<body>
  <h1>ANTHIVE – erster Kachelprototyp</h1>
  <p>Jede Vorschau zeigt eine 24 × 24-Pixel-Kachel vergrößert auf 192 × 192 Pixel.</p>
  <main>
    <figure><img src="tiles/topsoil.png" alt="Oberboden"><figcaption>Oberboden</figcaption></figure>
    <figure><img src="tiles/compact-earth.png" alt="Kompakte Erde"><figcaption>Kompakte Erde</figcaption></figure>
    <figure><img src="tiles/clay.png" alt="Lehm"><figcaption>Lehm</figcaption></figure>
    <figure><img src="tiles/stone-layer.png" alt="Steinschicht"><figcaption>Steinschicht</figcaption></figure>
    <figure><img src="tiles/deep-rock.png" alt="Tiefengestein"><figcaption>Tiefengestein</figcaption></figure>
    <figure><img src="tiles/grass-earth-transition.png" alt="Gras auf Erde"><figcaption>Gras-auf-Erde<small>gerader Übergang</small></figcaption></figure>
    <figure><img src="tiles/irregular-surface-edge.png" alt="Unregelmäßige Erdoberkante"><figcaption>Unregelmäßige Erdoberkante</figcaption></figure>
    <figure><img src="tiles/pond-shore-transition.png" alt="Teich und Ufer"><figcaption>Ufer- und Teichrandübergang</figcaption></figure>
  </main>
</body>
</html>
